<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YIBO Control Room</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui;background:#071017;color:#e8f3f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#12333a 0,transparent 33%),#071017}header{display:flex;justify-content:space-between;padding:28px 5vw 18px;border-bottom:1px solid #20333a}header strong{font-size:24px;letter-spacing:.12em}header span{color:#74d8c4;font-size:13px}main{width:min(1380px,92vw);margin:30px auto 70px;display:grid;gap:24px}.audio-card{padding:24px;border:1px solid #29434b;border-radius:20px;background:#0d1920}.audio-card h2{margin:0 0 8px}.audio-card p{color:#9db2b7}button,input{font:inherit}button{margin:4px;padding:11px 16px;border:1px solid #476069;border-radius:10px;color:#eefafa;background:#17262d;cursor:pointer}button:hover{border-color:#63dbc1}button:disabled{opacity:.4}pre{margin-top:16px;background:#071016;color:#86efc7;padding:14px;min-height:110px;max-height:220px;overflow:auto;border-radius:12px;font-size:12px}.warning{color:#f2c66d!important}
</style></head><body><header><strong>YIBO</strong><span>DEV CONTROL ROOM · 127.0.0.1:4317</span></header><main>
<yibo-api-configuration></yibo-api-configuration>
